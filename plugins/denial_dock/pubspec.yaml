name: denial_dock
description: A macOS-style floating dock for Denial with wave magnification, live window previews, drag reordering, drag-to-pin and smart auto-hide.
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  denial_sdk: '0.0.0'
  denial_flutter_sdk: '0.0.0'
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
dev_dependencies:
  flutter_lints: ^6.0.0

denial_plugin:
  schema: 1
  name: Dock
  provides:
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellSurface
