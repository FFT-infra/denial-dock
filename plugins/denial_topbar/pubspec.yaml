name: denial_topbar
description: A macOS-style menu bar and Dynamic Island for Denial, with configurable placement and workspace, media, battery, notification and tray modules.
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  dbus: ^0.7.14
  denial_sdk: '0.0.0'
  denial_flutter_sdk: '0.0.0'
  denial_shell_kit:
    path: ../../packages/denial_shell_kit
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
dev_dependencies:
  flutter_lints: ^6.0.0

denial_plugin:
  schema: 1
  name: Top Bar
  provides:
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellSurface
    - contract: package:denial_flutter_sdk/surfaces.dart#ShellWorkArea

flutter:
  # The CupertinoIcons glyphs are vendored so the bar does not depend on the
  # cupertino_icons package. Flutter prefixes a dependency package's family
  # with `packages/<package>/`, so the family stays unqualified here and
  # BarIcons sets fontPackage instead.
  fonts:
    - family: CupertinoIcons
      fonts:
        - asset: assets/CupertinoIcons.ttf
    # macOS draws its interface in SF Pro; Inter is the closest open metric
    # match and is vendored (OFL, see assets/Inter-OFL.txt) so the bar does
    # not depend on a font being installed on the host.
    - family: Inter
      fonts:
        - asset: assets/Inter-Regular.ttf
        - asset: assets/Inter-Medium.ttf
          weight: 500
        - asset: assets/Inter-SemiBold.ttf
          weight: 600
  assets:
    - assets/distro-fedora.png
    # The OFL requires the licence to travel with the font.
    - assets/Inter-OFL.txt
    - assets/CupertinoIcons-LICENSE.txt
